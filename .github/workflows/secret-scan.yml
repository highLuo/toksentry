name: Secret Scan

# 示例 CI 流：把 toksentry 接成流水线的"密钥泄露门禁"。
# 任何一次 push / PR 都会扫描代码，发现疑似密钥/令牌就直接让构建失败，
# 把泄露挡在合并之前。零依赖，只在 ubuntu-latest 上跑几秒。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  toksentry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test (证明扫描器本身能检出样本)
        run: python toksentry.py --self-test

      - name: Scan repository for leaked secrets
        # 命中任何密钥/令牌会以退出码 1 结束，从而阻断本次构建。
        # tests/ 下的伪密钥 fixtures 已在 .toksentryignore 中排除。
        run: python toksentry.py . --format table
