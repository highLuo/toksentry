[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toksentry"
version = "0.1.0"
description = "A dependency-free secret scanner for code repositories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
dependencies = []

[project.scripts]
toksentry = "toksentry:main"

[tool.setuptools]
py-modules = ["toksentry"]
